<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atmosphere: Grade 7 Flashcards</title>
<style>
:root{--bg:#f4f7fb;--fg:#1b2a41;--muted:#5b6b82;--card:#ffffff;--back:#e8f1fb;--line:#c9d6e6;--accent:#1f5fa8;--accent-fg:#ffffff;--ok:#2e8b57;--warn:#c8641c;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101826;--fg:#e8eef7;--muted:#9fb0c7;--card:#1a2638;--back:#16324f;--line:#2d3f58;--accent:#5aa2f0;--accent-fg:#0b1422;--ok:#5cc58a;--warn:#f0a060;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101826;--fg:#e8eef7;--muted:#9fb0c7;--card:#1a2638;--back:#16324f;--line:#2d3f58;--accent:#5aa2f0;--accent-fg:#0b1422;--ok:#5cc58a;--warn:#f0a060;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:18px 14px 28px}
h1{font-size:1.35rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 11px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stats{display:flex;justify-content:space-between;font-size:.88rem;color:var(--muted);margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.scene{perspective:1200px;min-height:260px}
.card{position:relative;width:100%;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s;border:0;background:none;padding:0;text-align:inherit;color:inherit;font:inherit}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);border-radius:16px;background:var(--card);padding:22px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:auto}
.face.b{transform:rotateY(180deg);background:var(--back)}
.tag{position:absolute;top:10px;left:14px;font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.mark{position:absolute;top:8px;right:14px;font-size:1.1rem;color:var(--ok);display:none}
.card.known .mark{display:block}
.q{font-size:1.2rem;font-weight:600}
.a{font-size:1.05rem;white-space:pre-line}
.hint{position:absolute;bottom:10px;font-size:.75rem;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.row button{flex:1 1 90px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:11px 8px;font-size:.92rem;cursor:pointer}
.row button.p{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row button.ok{border-color:var(--ok);color:var(--ok)}
.row button.rv{border-color:var(--warn);color:var(--warn)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.done{display:none;text-align:center;border:1px solid var(--ok);border-radius:14px;padding:16px;margin-top:14px}
.done.show{display:block}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main>
<h1>Atmosphere: Grade 7 Flashcards</h1>
<p class="sub">Tap a card to flip it. Mark the ones you know and keep going until the bar is full.</p>
<div class="chips" id="chips" role="group" aria-label="Topic filter"></div>
<div class="stats"><span id="pos">Card 1 of 1</span><span id="known">Known: 0</span></div>
<div class="bar"><i id="fill"></i></div>
<div class="scene"><button class="card" id="card" aria-label="Flashcard, tap to flip">
<div class="face f"><span class="tag" id="tagF"></span><span class="mark">✓</span><div class="q" id="front"></div><span class="hint">Tap to flip</span></div>
<div class="face b"><span class="tag" id="tagB"></span><span class="mark">✓</span><div class="a" id="back"></div></div>
</button></div>
<div class="row">
<button id="prev">← Back</button>
<button class="rv" id="again">↺ Study again</button>
<button class="ok" id="got">✓ I know it</button>
<button class="p" id="next">Next →</button>
</div>
<div class="row"><button id="shuf">Shuffle</button><button id="reset">Reset progress</button></div>
<div class="done" id="done"><strong>Well done!</strong> You know every card in this topic. Pick another topic or reset to practise again.</div>
</main>
<script>
var T = ["Composition","Layers","Weather","Elements","Instruments","Weather maps","Hazards"];
var C = [
[0,"Which gas is the largest part of dry air, and what is its share?","Nitrogen: about 78%."],
[0,"What share of the air is oxygen, and why does it matter?","About 21%.\nLiving organisms need it for breathing (respiration)."],
[0,"What makes up the last 1% of the air?","Argon, carbon dioxide, water vapour, ozone and other gases."],
[1,"What is the troposphere?","The lowest layer (from the surface up to about 8–18 km).\nWeather forms here, it holds almost all the water vapour, and the temperature falls with height."],
[1,"What is special about the stratosphere?","It lies above the troposphere (up to about 50 km).\nIt contains the ozone layer, which absorbs harmful ultraviolet radiation."],
[1,"Name the layers of the atmosphere from the surface upwards.","Troposphere → stratosphere → mesosphere → thermosphere → exosphere."],
[2,"What is weather?","The state of the lower atmosphere in a given place at a given moment."],
[2,"How is weather different from climate?","Weather: today’s conditions, changing quickly.\nClimate: the long-term pattern of weather in a region."],
[2,"“Today it is cloudy and a north wind blows at 5 m/s.” Weather or climate?","Weather. It describes one moment in one place."],
[3,"Name the six meteorological elements.","Temperature, pressure, wind, cloudiness, precipitation and humidity."],
[3,"What is air humidity?","The amount of water vapour in the air."],
[3,"What is cloudiness?","The degree to which the sky is covered by clouds."],
[3,"What is atmospheric pressure?","The force with which the air presses on the Earth’s surface."],
[3,"What is wind?","The horizontal movement of air.\nIt has a direction and a speed."],
[3,"What is precipitation?","Water that falls from clouds: rain, snow, hail."],
[3,"Why do we study meteorological elements?","To forecast the weather, keep people safe, plan farming, and organise transport and aviation."],
[4,"Which instrument measures air temperature?","Thermometer (in °C)."],
[4,"Which instrument measures atmospheric pressure?","Barometer."],
[4,"Which instrument measures air humidity?","Hygrometer."],
[4,"Which instrument measures the amount of precipitation?","Rain gauge (in millimetres)."],
[4,"Which instrument shows wind direction?","Weather vane."],
[4,"Which instrument measures wind speed?","Anemometer."],
[5,"What do the cloudiness symbols ○  ◐  ● mean?","○ clear sky\n◐ partly cloudy\n● overcast"],
[5,"What are the steps for drawing a temperature line graph?","1. Choose a scale and label the axes (days, °C).\n2. Plot each point.\n3. Join the points with a line.\n4. Add a title."],
[6,"How should you act during a blizzard?","Stay indoors, keep warm clothes and food at home, and avoid travelling."],
[6,"How should you act during a thunderstorm?","Stay indoors, switch off electrical devices, and keep away from open fields, tall trees and water."],
[6,"How should you act during a heat wave?","Drink plenty of water, avoid the midday sun, wear light clothes and stay in the shade."],
[6,"How should you act during a hailstorm?","Take shelter indoors, stay away from windows, and park cars under cover."]
];
var cards = C.map(function(c,i){return {id:i,t:c[0],q:c[1],a:c[2]}});
var known = {}, filter = -1, deck = [], idx = 0;
var $ = function(id){return document.getElementById(id)};
var cardEl = $("card");

function buildDeck(){
  deck = cards.filter(function(c){return filter < 0 || c.t === filter});
  idx = 0; render();
}
function render(){
  var c = deck[idx], n = deck.filter(function(x){return known[x.id]}).length;
  $("front").textContent = c.q; $("back").textContent = c.a;
  $("tagF").textContent = $("tagB").textContent = T[c.t];
  cardEl.classList.remove("flip");
  cardEl.classList.toggle("known", !!known[c.id]);
  $("pos").textContent = "Card " + (idx+1) + " of " + deck.length;
  $("known").textContent = "Known: " + n + " / " + deck.length;
  $("fill").style.width = (100*n/deck.length) + "%";
  $("done").classList.toggle("show", n === deck.length);
  $("got").textContent = known[c.id] ? "✓ Known" : "✓ I know it";
}
function go(d){ idx = (idx + d + deck.length) % deck.length; render(); }
function flip(){ cardEl.classList.toggle("flip"); }

cardEl.addEventListener("click", flip);
$("prev").onclick = function(){go(-1)};
$("next").onclick = function(){go(1)};
$("got").onclick = function(){ var c = deck[idx]; known[c.id] = !known[c.id]; render(); if (known[c.id]) setTimeout(function(){ if ($("done").classList.contains("show")) return; go(1); }, 250); };
$("again").onclick = function(){ delete known[deck[idx].id]; go(1); };
$("shuf").onclick = function(){ for (var i = deck.length-1; i > 0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = deck[i]; deck[i] = deck[j]; deck[j] = t; } idx = 0; render(); };
$("reset").onclick = function(){ known = {}; buildDeck(); };
document.addEventListener("keydown", function(e){
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " " || e.key === "Enter"){ if (document.activeElement.tagName !== "BUTTON" || document.activeElement === cardEl){ e.preventDefault(); flip(); } }
});

var chipBox = $("chips");
["All topics"].concat(T).forEach(function(name, i){
  var b = document.createElement("button");
  b.className = "chip"; b.textContent = name; b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  b.onclick = function(){
    filter = i - 1;
    Array.prototype.forEach.call(chipBox.children, function(x, k){ x.setAttribute("aria-pressed", k === i ? "true" : "false"); });
    buildDeck();
  };
  chipBox.appendChild(b);
});
buildDeck();
</script>
</body>
</html>
